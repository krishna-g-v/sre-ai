<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRE Agent</title>
    <style>
      /*
        Pure CSS, no JS — this has to paint before the app's module graph has even
        started loading (that's the whole point: it fills the gap that otherwise shows
        as a blank white page). React's root.render() call replaces #root's contents
        wholesale once the app mounts, so this disappears on its own — no cleanup script
        needed. prefers-color-scheme is the only theme signal available this early (the
        app's own light/dark toggle needs JS to read localStorage).
      */
      html { color-scheme: light dark; }
      body { margin: 0; background: #f7f9fc; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1720; }
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #initial-loader .spinner {
        width: 26px;
        height: 26px;
        border: 3px solid rgba(20, 116, 212, 0.2);
        border-top-color: #1474d4;
        border-radius: 50%;
        animation: sre-spin 0.8s linear infinite;
      }
      #initial-loader .label {
        font-size: 13px;
        color: #64748b;
      }
      @keyframes sre-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="initial-loader">
      <div class="spinner"></div>
      <div class="label">Loading SRE Agent&hellip;</div>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
